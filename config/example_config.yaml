run:
  executable: ./TestEm5
  build_dir: build-mt
  output_dir: output/tau_lab_example
  n_events: 1000000
  n_threads: 11
  random_seed: 12345
  macro_template: macros/template_run.mac
  generated_macro_dir: macros/generated

physics:
  inactivate_cerenkov: true

beam:
  primary_energy_MeV: 2.5

geometry:
  inner_lar:
    radius_cm: 5.0
    height_cm: 10.0
  outer_lar:
    diameter_cm: 35.0
    height_cm: 70.0
  neutron_detectors:
    - label: A0
      angle_deg: 25.0
      distance_cm: 100.0
    - label: A1
      angle_deg: 40.0
      distance_cm: 100.0
    - label: A2
      angle_deg: 50.0
      distance_cm: 100.0
    - label: A3
      angle_deg: 60.0
      distance_cm: 100.0
    - label: A4
      angle_deg: 90.0
      distance_cm: 100.0
    - label: A5
      angle_deg: 120.0
      distance_cm: 100.0
    - label: A6
      angle_deg: 150.0
      distance_cm: 100.0

optics:
  lar:
    scintillation_yield_per_MeV: 51300.0
    scintillation_yield_scale: 0.3
    absorption_length_cm: 150.0
    fast_time_ns: 7.0
    slow_time_ns: 1500.0
    fast_fraction: 0.75
    birks_constant_mm_per_MeV: 0.03
  tpb:
    # Geant4 WLSMEANNUMBERPHOTONS. Use 1.0 to reproduce the original code.
    efficiency: 1.0
  reflector:
    # Used for inactive PMT/SiPM patches.
    reflectivity: 0.98

sensors:
  pmt:
    side_length_cm: 2.54
    reflectivity: 0.2
    # response_mode options:
    # flat              : constant PDE given by pde/top_pde/bottom_pde
    # builtin_curve     : built-in curve scaled to the requested peak PDE
    # builtin_curve_raw : built-in curve used exactly as coded
    # csv_curve         : CSV curve scaled to the requested peak PDE
    # csv_curve_raw     : CSV curve used exactly as supplied
    response_mode: builtin_curve_raw
    # For builtin_curve/csv_curve, this scales the peak of the curve.
    # Set to 0 to use the built-in or CSV curve as an absolute curve without peak scaling.
    pde: 0.266
    top_pde: 0.266
    bottom_pde: 0.266
    # CSV format: wavelength_nm,qe or energy_eV,qe. qe can be fraction or percent.
    qe_curve_file: none
  sipm:
    tile_size_cm: 0.6
    reflectivity: 0.4
    response_mode: builtin_curve_raw
    pde: 0.402
    qe_curve_file: none

selection:
  require_detected: true
  require_num_pe_positive: true
  tof_window_ns: [40.0, 50.0]
  reject_inelastic_sensitive: true
  reject_external_scatter: false

analysis:
  expected_event_file_patterns:
    - "numPE_*.csv"
    - "event_summary*.csv"
  make_plots: true
  figure_format: png
  gamma_trend_calibration:
    # The optical/material parameters are inherited from this config file.
    energies_keV: [122.0, 511.0, 662.0, 1274.0]
    n_events_per_energy: 10000
    # Event simulation is parallel; gamma CSV rows are protected by a mutex.
    n_threads: 11
    source_position_cm: [0.0, 0.0, 0.0]
    # Keep only full-absorption events: total inner+outer LAr deposition must
    # be at least this fraction of the primary gamma energy.
    minimum_deposit_fraction: 0.99
    output_dir: output/gamma_calibration
  # Apply the event-level correction described in the thesis after the
  # experimental event selection. Raw numPE remains the trigger/cut quantity.
  neutron_scintillation_correction:
    enabled: false
    # Gamma light-yield relation consumed by neutron post-analysis:
    #   N_ph,gamma = slope_photons_per_MeV * eDep_MeV + intercept_photons
    # Running scripts/calibrate_gamma_trend.py writes the fitted values into
    # output/gamma_calibration/config_with_gamma_trend.yaml automatically.
    gamma_calibration:
      # Format A: use already-fitted coefficients (the normal workflow).
      slope_photons_per_MeV: 15390.0
      intercept_photons: 0.0
      # Format B: alternatively, delete slope_photons_per_MeV and
      # intercept_photons above, then supply >=2 [energy, mean photons] points.
      # The analysis will fit a straight line to these points itself.
      # energy_unit: keV
      # points: [[511.0, 7800.0], [1274.0, 19500.0]]
    leff:
      # Temporary energy-independent nuclear-recoil efficiency.
      constant: 0.3
      # For an energy-dependent Leff, remove "constant" and instead provide:
      # energy_unit: keV
      # extrapolation: error  # choices: error, nan, clip, linear
      # points: [[7.1, 0.243], [13.7, 0.258], [117.8, 0.349]]
